# Deployment stack for preprod and production: MariaDB, MinIO file storage, the Next.js app, HTTPS via nginx, daily backups.
# Each environment gets its own project name and env file:
#   docker compose -p shopos-prod --env-file .env.production up -d --build --wait
#   docker compose -p shopos-preprod --env-file .env.preprod up -d --build --wait
# See .env.production.example for every setting and DEPLOYMENT.md for operations.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-db-credentials: &db-credentials
  SHOPOS_DB_NAME: ${SHOPOS_DB_NAME:-shopos}
  SHOPOS_DB_USER: ${SHOPOS_DB_USER:-shopos}
  SHOPOS_DB_PASSWORD: ${SHOPOS_DB_PASSWORD:?Set SHOPOS_DB_PASSWORD in the env file}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${SHOPOS_DB_ROOT_PASSWORD:?Set SHOPOS_DB_ROOT_PASSWORD in the env file}
      MARIADB_DATABASE: ${SHOPOS_DB_NAME:-shopos}
      MARIADB_USER: ${SHOPOS_DB_USER:-shopos}
      MARIADB_PASSWORD: ${SHOPOS_DB_PASSWORD:?Set SHOPOS_DB_PASSWORD in the env file}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=${SHOPOS_DB_BUFFER_POOL:-256M}
    volumes:
      - db-data:/var/lib/mysql
    # No ports: the database is reachable only from the app and backup containers.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # S3-compatible file storage: product photos and payment proofs. The app creates its bucket and
  # serves files itself, so the S3 API is not published; the web console is, on this machine only.
  # pgsty/minio is the community build of MinIO (upstream stopped publishing images).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SHOPOS_S3_ACCESS_KEY:?Set SHOPOS_S3_ACCESS_KEY in the env file}
      MINIO_ROOT_PASSWORD: ${SHOPOS_S3_SECRET_KEY:?Set SHOPOS_S3_SECRET_KEY in the env file}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${SHOPOS_MINIO_CONSOLE_PORT:-9001}
    ports:
      - "127.0.0.1:${SHOPOS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopos:${SHOPOS_VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *db-credentials
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SHOPOS_STORAGE: mariadb
      SHOPOS_DB_HOST: db
      SHOPOS_DB_PORT: 3306
      # File storage. Point these at AWS S3 or Cloudflare R2 instead to move files off this machine.
      SHOPOS_S3_ENDPOINT: ${SHOPOS_S3_ENDPOINT:-http://minio:9000}
      SHOPOS_S3_REGION: ${SHOPOS_S3_REGION:-us-east-1}
      SHOPOS_S3_BUCKET: ${SHOPOS_S3_BUCKET:-shopos}
      SHOPOS_S3_ACCESS_KEY: ${SHOPOS_S3_ACCESS_KEY:?Set SHOPOS_S3_ACCESS_KEY in the env file}
      SHOPOS_S3_SECRET_KEY: ${SHOPOS_S3_SECRET_KEY:?Set SHOPOS_S3_SECRET_KEY in the env file}
      # Links in emails (verify, reset, invite) start with this address.
      SHOPOS_PUBLIC_URL: ${SHOPOS_PUBLIC_URL:?Set SHOPOS_PUBLIC_URL in the env file}
      # Outgoing email. With COMPOSE_PROFILES=mailpit these point at the local Mailpit inbox.
      SHOPOS_SMTP_HOST: ${SHOPOS_SMTP_HOST:?Set SHOPOS_SMTP_HOST in the env file}
      SHOPOS_SMTP_PORT: ${SHOPOS_SMTP_PORT:-587}
      SHOPOS_SMTP_SECURE: ${SHOPOS_SMTP_SECURE:-false}
      SHOPOS_SMTP_USER: ${SHOPOS_SMTP_USER:-}
      SHOPOS_SMTP_PASSWORD: ${SHOPOS_SMTP_PASSWORD:-}
      SHOPOS_MAIL_FROM: ${SHOPOS_MAIL_FROM:?Set SHOPOS_MAIL_FROM in the env file}
      # New shop signups allowed per IP address per hour.
      SHOPOS_SIGNUP_LIMIT: ${SHOPOS_SIGNUP_LIMIT:-10}
      # Where shops send subscription payments (shown on their Billing page). Empty uses the built-in defaults.
      SHOPOS_PAY_BANK_NAME: ${SHOPOS_PAY_BANK_NAME:-}
      SHOPOS_PAY_ACCOUNT_TITLE: ${SHOPOS_PAY_ACCOUNT_TITLE:-}
      SHOPOS_PAY_ACCOUNT_NUMBER: ${SHOPOS_PAY_ACCOUNT_NUMBER:-}
      SHOPOS_PAY_IBAN: ${SHOPOS_PAY_IBAN:-}
      SHOPOS_PAY_WALLET: ${SHOPOS_PAY_WALLET:-}
      SHOPOS_PAY_WHATSAPP: ${SHOPOS_PAY_WHATSAPP:-}
      # Card payments through Paddle (lib/paddle.ts, DEPLOYMENT.md). Card plans show on Billing once the
      # client token, webhook secret and a price are set; the API key adds plan changes and the portal.
      SHOPOS_PADDLE_ENV: ${SHOPOS_PADDLE_ENV:-sandbox}
      SHOPOS_PADDLE_CLIENT_TOKEN: ${SHOPOS_PADDLE_CLIENT_TOKEN:-}
      SHOPOS_PADDLE_API_KEY: ${SHOPOS_PADDLE_API_KEY:-}
      SHOPOS_PADDLE_WEBHOOK_SECRET: ${SHOPOS_PADDLE_WEBHOOK_SECRET:-}
      SHOPOS_PADDLE_PRICE_STARTER_MONTH: ${SHOPOS_PADDLE_PRICE_STARTER_MONTH:-}
      SHOPOS_PADDLE_PRICE_STARTER_YEAR: ${SHOPOS_PADDLE_PRICE_STARTER_YEAR:-}
      SHOPOS_PADDLE_PRICE_GROWTH_MONTH: ${SHOPOS_PADDLE_PRICE_GROWTH_MONTH:-}
      SHOPOS_PADDLE_PRICE_GROWTH_YEAR: ${SHOPOS_PADDLE_PRICE_GROWTH_YEAR:-}
      # Automatic WhatsApp day-end reports through Meta's Cloud API (see DEPLOYMENT.md). Empty = off.
      SHOPOS_WHATSAPP_TOKEN: ${SHOPOS_WHATSAPP_TOKEN:-}
      SHOPOS_WHATSAPP_PHONE_ID: ${SHOPOS_WHATSAPP_PHONE_ID:-}
      SHOPOS_WHATSAPP_TEMPLATE: ${SHOPOS_WHATSAPP_TEMPLATE:-daily_report}
      SHOPOS_WHATSAPP_LANG: ${SHOPOS_WHATSAPP_LANG:-en}
      # Server time zone (logs, backups). Each shop picks its own zone for "today" in Settings.
      TZ: ${SHOPOS_TZ:-Asia/Karachi}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: ${SHOPOS_APP_MEMORY:-768m}
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # HTTPS in front of the app: nginx (latest stable line) with the ShopOS config. docs/nginx.md.
  nginx:
    build:
      context: ./deploy/nginx
    image: shopos-nginx:${SHOPOS_VERSION:-local}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Inside the container nginx listens on the same ports the host publishes, so redirects and
      # links that include a port (preprod's 8443) stay correct.
      - "${SHOPOS_HTTP_PORT:-80}:${SHOPOS_HTTP_PORT:-80}"
      - "${SHOPOS_HTTPS_PORT:-443}:${SHOPOS_HTTPS_PORT:-443}"
    environment:
      SHOPOS_DOMAIN: ${SHOPOS_DOMAIN:?Set SHOPOS_DOMAIN in the env file}
      SHOPOS_PUBLIC_URL: ${SHOPOS_PUBLIC_URL:?Set SHOPOS_PUBLIC_URL in the env file}
      # internal (self-signed) · an email address (Let's Encrypt, with COMPOSE_PROFILES=letsencrypt) ·
      # '/etc/nginx/certs/origin.pem /etc/nginx/certs/origin.key' (files in SHOPOS_CERTS_DIR)
      SHOPOS_TLS: ${SHOPOS_TLS:-internal}
      SHOPOS_HSTS: ${SHOPOS_HSTS:-max-age=0}
      SHOPOS_HTTP_PORT: ${SHOPOS_HTTP_PORT:-80}
      SHOPOS_HTTPS_PORT: ${SHOPOS_HTTPS_PORT:-443}
      # Space-separated proxy ranges to trust for the visitor's address (Cloudflare's on the cloud server).
      SHOPOS_TRUSTED_PROXIES: ${SHOPOS_TRUSTED_PROXIES:-127.0.0.1/32}
      SHOPOS_REAL_IP_HEADER: ${SHOPOS_REAL_IP_HEADER:-CF-Connecting-IP}
    volumes:
      - nginx-state:/etc/nginx/shopos/state
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/acme:ro
      # Certificate files you provide, e.g. a Cloudflare origin certificate.
      - ${SHOPOS_CERTS_DIR:-./certs}:/etc/nginx/certs:ro
      # Extra sites (subdomains, the landing page): *.conf.template files, applied by `shopos reload`.
      - ./deploy/nginx/sites:/etc/nginx/templates/sites:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${SHOPOS_HTTP_PORT}/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  # Let's Encrypt certificates for nginx: issued on start, renewed twice a day when due.
  # Only with COMPOSE_PROFILES=letsencrypt (deploy/install.sh sets it when you choose Let's Encrypt).
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["letsencrypt"]
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/shopos-certbot.sh"]
    environment:
      SHOPOS_DOMAIN: ${SHOPOS_DOMAIN:?Set SHOPOS_DOMAIN in the env file}
      SHOPOS_TLS: ${SHOPOS_TLS:-}
      # More names to get certificates for (space-separated), for sites in deploy/nginx/sites.
      SHOPOS_EXTRA_DOMAINS: ${SHOPOS_EXTRA_DOMAINS:-}
      SHOPOS_LETSENCRYPT_STAGING: ${SHOPOS_LETSENCRYPT_STAGING:-}
    volumes:
      - ./deploy/nginx/certbot.sh:/usr/local/bin/shopos-certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Local test inbox for environments without a real mail provider (COMPOSE_PROFILES=mailpit).
  # Its web UI is published on this machine only.
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: ["mailpit"]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${SHOPOS_MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    command: ["--database", "/data/mailpit.db"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  backup:
    image: mariadb:11.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/db-backup.sh"]
    environment:
      <<: *db-credentials
      BACKUP_INTERVAL_SECONDS: ${SHOPOS_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${SHOPOS_BACKUP_KEEP_DAYS:-14}
      TZ: ${SHOPOS_TZ:-Asia/Karachi}
    volumes:
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
      # A host folder, so dumps are easy to copy off the machine.
      - ${SHOPOS_BACKUP_DIR:-./backups}:/backups
      # Stored files (photos, payment proofs), archived next to each database dump.
      - minio-data:/minio-data:ro
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  db-data:
  minio-data:
  nginx-state:
  letsencrypt:
  acme-webroot:
  mailpit-data:
